[package]
name = "concord-dtu-sidecar"
version = "0.1.0"
edition = "2021"
description = "Read-only DTU reader for the Concord dtu_store — keeps DTU list/get off the Node event loop"

[[bin]]
name = "concord-dtu-sidecar"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
